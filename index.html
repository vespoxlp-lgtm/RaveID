<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaveID | Underground Track Finder</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --neon-green: #00ff41;
            --neon-purple: #bd00ff;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --font-display: 'Courier New', Courier, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- HEADER & GLITCH EFFECT --- */
        header {
            width: 100%;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #222;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            position: relative;
            display: inline-block;
        }

        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        h1::before {
            left: 2px;
            text-shadow: -1px 0 var(--neon-purple);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -1px 0 var(--neon-green);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 31px, 0); }
            20% { clip: rect(70px, 9999px, 91px, 0); }
            40% { clip: rect(20px, 9999px, 60px, 0); }
            60% { clip: rect(10px, 9999px, 40px, 0); }
            80% { clip: rect(80px, 9999px, 100px, 0); }
            100% { clip: rect(30px, 9999px, 70px, 0); }
        }

        /* --- MAIN CONTAINER --- */
        main {
            width: 100%;
            max-width: 600px;
            padding: 0 1rem;
        }

        /* --- TABS --- */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 5px;
            border: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 1rem;
            font-family: var(--font-display);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: #222;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        .tab-btn.active.mode-record {
            color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(189, 0, 255, 0.2);
        }

        /* --- PANELS --- */
        .panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .panel.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- FORMS & INPUTS --- */
        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-family: var(--font-display);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 1rem;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-family: var(--font-display);
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--neon-green);
        }

        .btn-action {
            width: 100%;
            padding: 1.2rem;
            background: var(--neon-green);
            color: #000;
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            font-family: var(--font-display);
            cursor: pointer;
            font-size: 1.1rem;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .btn-action:hover {
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
            transform: translateY(-2px);
        }

        .btn-action:active { transform: translateY(1px); }

        /* --- RECORDING VISUALIZER --- */
        .visualizer-container {
            height: 150px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #222;
            border: 2px solid #555;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .record-inner {
            width: 30px;
            height: 30px;
            background: #ff3333;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .recording .record-btn {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
            animation: pulse 1.5s infinite;
        }

        .recording .record-inner {
            border-radius: 4px;
            transform: scale(0.6);
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(189, 0, 255, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(189, 0, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(189, 0, 255, 0); } }

        /* --- RESULTS --- */
        #results-area {
            margin-top: 2rem;
        }

        .result-card {
            background: var(--card-bg);
            border-left: 4px solid var(--neon-green);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 0 4px 4px 0;
            animation: slideIn 0.4s ease;
        }

        .result-card.unreleased {
            border-left-color: var(--neon-purple);
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        .track-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .track-artist {
            color: var(--neon-green);
            font-family: var(--font-display);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .meta-tag {
            display: inline-block;
            padding: 4px 8px;
            background: #222;
            color: #aaa;
            font-size: 0.8rem;
            border-radius: 3px;
            margin-right: 0.5rem;
            font-family: var(--font-display);
        }

        .source-text {
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }

        .loading-bar {
            height: 2px;
            background: var(--neon-green);
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 10px var(--neon-green);
        }

        footer {
            margin-top: 3rem;
            color: #444;
            font-size: 0.8rem;
            padding-bottom: 2rem;
        }

        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1 data-text="RAVEID">RAVEID</h1>
        <p style="color: #666; font-size: 0.9rem; margin-top: 0.5rem; letter-spacing: 2px;">INTELLIGENT TRACK IDENTIFICATION</p>
    </header>

    <main>
        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('search')">Search Database</button>
            <button class="tab-btn" id="record-tab-btn" onclick="switchTab('record')">Audio ID</button>
        </div>

        <!-- Panel 1: Text Search -->
        <section id="panel-search" class="panel active">
            <div class="input-group">
                <label>ARTIST / EVENT / FESTIVAL</label>
                <input type="text" id="search-input" placeholder="e.g. Klangkuenstler Vault Sessions">
            </div>
            
            <div class="input-group">
                <label>TIMESTAMP (MIN:SEC)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="time-min" placeholder="Min" min="0" style="width: 50%;">
                    <input type="number" id="time-sec" placeholder="Sec" min="0" max="59" style="width: 50%;">
                </div>
            </div>

            <button class="btn-action" onclick="performSearch()">Find Track ID</button>
        </section>

        <!-- Panel 2: Audio Recording -->
        <section id="panel-record" class="panel">
            <div class="visualizer-container">
                <canvas id="visualizer"></canvas>
            </div>
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <p id="record-status" style="color: #666; margin-bottom: 1rem; font-family: var(--font-display);">TAP TO START LISTENING</p>
                <div class="record-btn" id="record-btn" onclick="toggleRecording()">
                    <div class="record-inner"></div>
                </div>
            </div>

            <button class="btn-action hidden" id="audio-identify-btn" style="background-color: var(--neon-purple); color: white;" onclick="performAudioSearch()">Identify Audio</button>
        </section>

        <!-- Results Section -->
        <div id="results-area"></div>
        <div id="loading-container" class="hidden" style="margin-top: 2rem;">
            <div class="loading-bar" id="loading-bar"></div>
            <p style="text-align: right; color: var(--neon-green); font-size: 0.8rem; margin-top: 5px;" id="loading-text">SCANNING NETWORK...</p>
        </div>

    </main>

    <footer>
        RAVEID PROTOTYPE v1.0 // CONNECTING TO THE UNDERGROUND
    </footer>

    <script>
        /* --- MOCK DATABASE --- */
        // In a real app, this comes from the Node.js backend
        const MOCK_DB = [
            {
                artist: "Klangkuenstler",
                track: "Mind Control",
                status: "UNRELEASED",
                source: "YouTube Comment @technohead99",
                keywords: ["klangkuenstler", "vault", "2026"]
            },
            {
                artist: "SNTS",
                track: "Untitled A1",
                status: "UNRELEASED",
                source: "Reddit /r/techno",
                keywords: ["snts", "industrial"]
            },
            {
                artist: "I Hate Models",
                track: "Never Forget",
                status: "RELEASED",
                source: "1001Tracklists",
                keywords: ["hate", "models"]
            }
        ];

        /* --- UI LOGIC --- */
        function switchTab(mode) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`panel-${mode}`).classList.add('active');
            
            const btnIndex = mode === 'search' ? 0 : 1;
            document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
            
            if (mode === 'record') {
                document.getElementById('record-tab-btn').classList.add('mode-record');
            } else {
                document.getElementById('record-tab-btn').classList.remove('mode-record');
            }
        }

        /* --- SEARCH SIMULATION --- */
        function performSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const min = document.getElementById('time-min').value;
            const sec = document.getElementById('time-sec').value;
            
            if(!query) {
                alert("Please enter an artist or event name.");
                return;
            }

            startLoading(() => {
                // Simulate backend filtering logic
                const match = MOCK_DB.find(item => 
                    item.keywords.some(k => query.includes(k))
                );

                const timeString = (min || "00") + ":" + (sec || "00");

                if (match) {
                    displayResult({
                        artist: match.artist,
                        track: match.track,
                        status: match.status,
                        source: match.source,
                        time: timeString
                    });
                } else {
                    displayResult({
                        artist: "Unknown Artist",
                        track: "ID Track (Unknown)",
                        status: "UNRELEASED",
                        source: "No direct match found in comments",
                        time: timeString
                    });
                }
            });
        }

        /* --- AUDIO RECORDING LOGIC (Visualizer Only) --- */
        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        let isRecording = false;

        async function toggleRecording() {
            const statusText = document.getElementById('record-status');
            const btn = document.getElementById('record-btn');
            const idBtn = document.getElementById('audio-identify-btn');

            if (!isRecording) {
                // Start
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

                    analyser.smoothingTimeConstant = 0.8;
                    analyser.fftSize = 1024;

                    microphone.connect(analyser);
                    analyser.connect(javascriptNode);
                    javascriptNode.connect(audioContext.destination);

                    drawVisualizer();

                    isRecording = true;
                    document.body.classList.add('recording');
                    statusText.innerText = "LISTENING TO ENVIRONMENT...";
                    statusText.style.color = "var(--neon-purple)";
                    
                    // Show identify button after 2 seconds
                    setTimeout(() => {
                        if(isRecording) idBtn.classList.remove('hidden');
                    }, 2000);

                } catch (err) {
                    console.error(err);
                    statusText.innerText = "MIC ACCESS DENIED";
                }
            } else {
                // Stop
                if (audioContext) audioContext.close();
                isRecording = false;
                document.body.classList.remove('recording');
                statusText.innerText = "TAP TO START LISTENING";
                statusText.style.color = "#666";
                idBtn.classList.add('hidden');
            }
        }

        function drawVisualizer() {
            if(!isRecording) return;
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // Handle high DPI
            if (canvas.width !== canvas.clientWidth) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            }

            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#000'; // Ensure black bg
            ctx.fillRect(0,0,width,height);

            const barWidth = (width / array.length) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < array.length; i++) {
                barHeight = array[i] / 2;
                ctx.fillStyle = `rgb(${barHeight + 100}, 0, 255)`; // Purple hues
                ctx.fillRect(x, height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }

            requestAnimationFrame(drawVisualizer);
        }

        function performAudioSearch() {
            toggleRecording(); // Stop recording
            startLoading(() => {
                // Random result for audio
                const results = [
                    { artist: "Schranz Master", track: "Distortion", status: "UNRELEASED" },
                    { artist: "Unknown", track: "Hardtechno Banger", status: "UNRELEASED" }
                ];
                const r = results[Math.floor(Math.random() * results.length)];
                
                displayResult({
                    artist: r.artist,
                    track: r.track,
                    status: r.status,
                    source: "Audio Fingerprint Match (92%)",
                    time: "Live Recording"
                });
            });
        }

        /* --- HELPER FUNCTIONS --- */
        function startLoading(callback) {
            const loader = document.getElementById('loading-container');
            const bar = document.getElementById('loading-bar');
            const txt = document.getElementById('loading-text');
            const results = document.getElementById('results-area');

            results.innerHTML = "";
            loader.classList.remove('hidden');
            bar.style.width = "0%";
            
            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 10;
                if(width > 100) width = 100;
                bar.style.width = width + "%";
                
                if(width === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loader.classList.add('hidden');
                        callback();
                    }, 500);
                }
            }, 200);
        }

        function displayResult(data) {
            const div = document.createElement('div');
            div.className = `result-card ${data.status === 'UNRELEASED' ? 'unreleased' : ''}`;
            
            div.innerHTML = `
                <div class="track-title">${data.track}</div>
                <div class="track-artist">${data.artist}</div>
                <div>
                    <span class="meta-tag">${data.time}</span>
                    <span class="meta-tag" style="border: 1px solid ${data.status === 'UNRELEASED' ? 'var(--neon-purple)' : '#444'}">${data.status}</span>
                </div>
                <div class="source-text">
                    Source: ${data.source}
                </div>
            `;
            document.getElementById('results-area').appendChild(div);
        }
    </script>
</body>
</html>
